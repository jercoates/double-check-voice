name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        working-directory: stt-chain
      - run: pytest -q
        working-directory: tools

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t dcv-stt-chain:ci stt-chain/
      - name: Starts closed, and refuses to start without an allowlist
        run: |
          set +e
          docker run --rm -e DCV_WHISPER_URI=tcp://127.0.0.1:1 dcv-stt-chain:ci 2>&1 | tee out.txt
          grep -q "DCV_ALLOWED_PEERS is empty" out.txt
